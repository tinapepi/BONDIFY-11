name: Bondify visual browser checks
on:
  push:
    branches: ['test/**']
  pull_request:
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test http-server
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bondify-visual-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
