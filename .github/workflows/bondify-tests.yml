name: Bondify Node acceptance checks
on:
  push:
    branches: ['test/**']
  pull_request:
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
